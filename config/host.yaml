model:
  name: "unet"
  in_channels: 1
  out_channels: 1
  base_filters: 8
  depth: 2

train:
  epochs: 10
  batch_size: 1
  learning_rate: 1.0e-2
  weight_decay: 1.0e-5
  patch_size: [16, 16, 16]
  max_patches_per_volume: 64
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 5
  # 分割表面项: dice | tversky | focal_dice（与 BCE 各半加权）
  segmentation_surface_loss: "tversky"
  tversky_alpha: 0.3
  tversky_beta: 0.7
  focal_dice_gamma: 1.3333333333333333
  loss_smooth: 1.0e-6

data:
  train_dirs:
    - "/home/napbad/project/graduate_proj/core_model/dataset/SingleCrop"
    # - "/home/napbad/project/graduate_proj/core_model/dataset/MultiCrop"
  eval_dirs:
    - "/home/napbad/project/graduate_proj/core_model/dataset/SingleCrop"
    # - "/home/napbad/project/graduate_proj/core_model/dataset/Multi"
  num_workers: 2
  prefetch_factor: 2
  file_patterns:
    - "*_origin.nii.gz"
    - "*_brainpre.nii.gz"
  label_suffix:
    - "_label.nii.gz"
    - "_ias.nii.gz"
  train_ratio: 0.8
  patches_per_volume: 4
  patch_sampling_mode: "foreground_priority"   # avaiable "foreground_only" "background_priority" "sequential"
  background_per_foreground: 2
  max_load: 10
  eval_max_load: 1

async_load:
  ram_cache_gb: 8.0
  vram_batch_gb: 2.0
  auto_config: true

compile:
  enabled: false
  mode: "default"
  fullgraph: false

checkpoint:
  save_dir: "checkpoints"
  save_best: true
  save_interval: 10
  max_keep: 3

risk:
  enabled: true 
  excel_path: "/home/napbad/project/graduate_proj/core_model/dataset/data.xlsx"
  label_column: "破裂"
  id_column: "7lesion_id"
  feature_columns: []
  task_type: "binary"
  save_dir: "checkpoints/risk"
  use_cleaned_data: true
  use_dummy_metadata: false
  dummy_num_rows: 512
  metadata_columns: ["年龄", "性别", "部位"]
  num_heads: 4
  hidden_dim: 128
  num_layers: 5
  dropout: 0.1
  epochs: 5000
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  auto_max_features: 300
  feature_select_method: "mutual_info"
  categorical_min_frequency: 5
  use_pyradiomics_overlap_only: true
  clinic_columns: ["性别", "年龄", "高血压", "心脏病", "糖尿病", "脑血管硬化", "饮酒", "抽烟", "出血史"]
  saved_data_dir: "data/saved_data"
  predict_res_path: ""
  src_path: ""
  radiomics_backend: "pyradiomics-cuda"
  cta_viewer_mode: "tri-planar"
  segmentation_endpoint: "/api/cta/segment"
  risk_endpoint: "/api/risk/predict"

device: "cuda"
seed: 42
log_dir: "logs"
eval_interval: 1

overlap_inference:
  enabled: true
  # Overlapping patch inference for reduced boundary artifacts
  patch_size: [16, 16, 16]        # Full patch size (should match training patch_size)
  effective_size: [16, 16, 16]   # Center region kept for output; stride = effective_size
  # effective_size: [32, 32, 32] # Alternative: more overlap, more robust edges
  padding_mode: "reflect"         # Boundary padding: "reflect" (recommended), "constant"
  padding_value: 0.0               # Fill value for constant padding
  blend_mode: "gaussian"          # Blending: "gaussian" (recommended) or "average"
  gaussian_sigma: 0.4             # Gaussian sigma (relative to effective_size)
  binarize_threshold: 0.5          # Threshold for probability-to-mask conversion
  use_amp: true                   # Enable automatic mixed precision (FP16)
  batch_size: 4                   # Inference batch size
