model:
  name: "unet"
  in_channels: 1
  out_channels: 1
  base_filters: 32
  depth: 4

train:
  epochs: 50
  batch_size: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  patch_size: [128, 128, 128]
  max_patches_per_volume: 64
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 5

data:
  train_dirs:
    - "/home/napbad/project/graduate_proj/core_model/dataset/SingleCrop"
    - "/home/napbad/project/graduate_proj/core_model/dataset/MultiCrop"
  eval_dirs:
    - "/home/napbad/project/graduate_proj/core_model/dataset/Single"
    - "/home/napbad/project/graduate_proj/core_model/dataset/Multi"
  num_workers: 2
  prefetch_factor: 2
  file_patterns:
    - "*_origin.nii.gz"
    - "*_brainpre.nii.gz"
  label_suffix: "_label.nii.gz"
  train_ratio: 0.8

async_load:
  ram_cache_gb: 8.0
  vram_batch_gb: 2.0
  auto_config: true

compile:
  enabled: false
  mode: "default"
  fullgraph: false

checkpoint:
  save_dir: "checkpoints"
  save_best: true
  save_interval: 10
  max_keep: 3

risk:
  enabled: false
  excel_path: "/home/napbad/project/graduate_proj/core_model/dataset/data.xlsx"
  label_column: "破裂"
  id_column: "7lesion_id"
  feature_columns: []
  task_type: "binary"
  save_dir: "checkpoints/risk"
  use_cleaned_data: true
  use_dummy_metadata: false
  dummy_num_rows: 512
  metadata_columns: ["年龄", "性别", "部位"]
  num_heads: 4
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  epochs: 50
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  auto_max_features: 64
  feature_select_method: "mutual_info"
  categorical_min_frequency: 5
  radiomics_backend: "pyradiomics-cuda"
  cta_viewer_mode: "tri-planar"
  segmentation_endpoint: "/api/cta/segment"
  risk_endpoint: "/api/risk/predict"

device: "cuda"
seed: 42
log_dir: "logs"
eval_interval: 5
