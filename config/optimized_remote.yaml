model:
  name: "optimized_unet"
  in_channels: 1
  out_channels: 1
  base_filters: 48
  depth: 5
  use_residual: true
  use_attention: true
  dropout: 0.1
  norm_type: "instance"
  activation: "leaky_relu"

train:
  epochs: 20
  batch_size: 1
  learning_rate: 5.0e-4
  weight_decay: 1.0e-5
  patch_size: [128, 128, 128]
  max_patches_per_volume: 64
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5

data:
  train_dirs:
    - "/hyperai/input/input0/singlecrop1"
    - "/hyperai/input/input0/singlecrop2"
    - "/hyperai/input/input0/singlecrop3"
    - "/hyperai/input/input0/MultiCrop"
  eval_dirs:
    - "/hyperai/input/input0/Multi"
    - "/hyperai/input/input0/singlecrop4"
  num_workers: 8
  prefetch_factor: 4
  file_patterns:
    - "*_origin.nii.gz"
    - "*_brainpre.nii.gz"
  label_suffix: "_label.nii.gz"

async_load:
  ram_cache_gb: 30.0
  vram_batch_gb: 4.0
  auto_config: true

compile:
  enabled: false
  mode: "reduce-overhead"
  fullgraph: false

checkpoint:
  save_dir: "checkpoints_optimized"
  save_best: true
  save_interval: 20
  max_keep: 5

device: "cuda"
seed: 42
log_dir: "logs_optimized"
eval_interval: 1
