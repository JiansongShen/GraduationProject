model:
  name: "optimized_unet"
  in_channels: 1
  out_channels: 1
  base_filters: 48
  depth: 5
  use_residual: true
  use_attention: true
  dropout: 0.1
  norm_type: "instance"
  activation: "leaky_relu"

train:
  epochs: 20
  batch_size: 1
  learning_rate: 5.0e-4
  weight_decay: 1.0e-5
  patch_size: [128, 128, 128]
  max_patches_per_volume: 64
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5

data:
  train_dirs:
    - "/hyperai/input/input0/singlecrop1"
    - "/hyperai/input/input0/singlecrop2"
    - "/hyperai/input/input0/singlecrop3"
    - "/hyperai/input/input0/MultiCrop"
  eval_dirs:
    - "/hyperai/input/input0/Multi"
    - "/hyperai/input/input0/singlecrop4"
  num_workers: 8
  prefetch_factor: 4
  file_patterns:
    - "*_origin.nii.gz"
    - "*_brainpre.nii.gz"
  label_suffix: "_label.nii.gz"

async_load:
  ram_cache_gb: 30.0
  vram_batch_gb: 4.0
  auto_config: true

compile:
  enabled: false
  mode: "reduce-overhead"
  fullgraph: false

checkpoint:
  save_dir: "checkpoints_optimized"
  save_best: true
  save_interval: 20
  max_keep: 5

risk:
  enabled: false
  excel_path: "/home/napbad/project/graduate_proj/core_model/dataset/data.xlsx"
  label_column: "破裂"
  id_column: "7lesion_id"
  feature_columns: []
  task_type: "binary"
  save_dir: "checkpoints/risk"
  use_cleaned_data: true
  use_dummy_metadata: false
  dummy_num_rows: 512
  metadata_columns: ["年龄", "性别", "部位"]
  num_heads: 4
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  epochs: 50
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  auto_max_features: 64
  feature_select_method: "mutual_info"
  categorical_min_frequency: 5
  use_pyradiomics_overlap_only: true
  clinic_columns: ["性别", "年龄", "高血压", "心脏病", "糖尿病", "脑血管硬化", "饮酒", "抽烟", "出血史"]
  saved_data_dir: "data/saved_data"
  predict_res_path: ""
  src_path: ""

device: "cuda"
seed: 42
log_dir: "logs_optimized"
eval_interval: 1
